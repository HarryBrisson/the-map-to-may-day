<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Haymarket Map{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">The Map to May Day</p>
        <h1>Haymarket Trial Map</h1>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ url_for('index') }}">Map</a>
        <a href="{{ url_for('transcripts') }}">Transcripts</a>
        <a href="{{ url_for('health') }}">Health</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
